<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>LR Entry · SNT</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://script.google.com"/>
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet"/>
<meta name="theme-color" content="#2f2d28"/>
<link rel="icon" href="logo.png"/>
<link rel="stylesheet" href="app.css"/>
</head>
<body>

<header class="app-bar">
  <span class="bar-logo"><img src="logo.png" alt="SNT"/></span>
  <span class="bar-title"><b>LR Entry</b><small>Shree Narayani Traders</small></span>
  <span class="status-dot" id="statusDot"></span>
  <span class="bar-clock" id="clock">--:--</span>
  <button class="who-btn" id="whoBtn" onclick="showGate('')"></button>
  <button class="refresh-btn" id="refreshBtn" onclick="loadData()" aria-label="Refresh">↻</button>
</header>

<div class="chips-row" id="chips"></div>

<div class="search-row">
  <span class="search-icon">🔍</span>
  <input type="search" id="searchInput" class="search-input" placeholder="Search party name, bill no, transport…" oninput="render()"/>
</div>

<main class="list" id="list">
  <div class="empty"><div class="empty-icon">🔌</div><div class="empty-title">Connecting…</div><div class="empty-sub">Please wait</div></div>
</main>

<script src="app.js"></script>
<script>
document.body.insertAdjacentHTML('beforeend', GATE_HTML);

const COMPANIES = ['All', 'SNT', 'MRS'];
let records = [], transports = [], coFilter = 'All';
const typed = {};   // consignment key -> { lr, transport, other, date } as being entered
function entry(m) {
  return typed[m.key] || (typed[m.key] = { lr: '', transport: m.dispatchTransport || '', other: '', date: String(m.dispatchedAt).substring(0, 10) });
}
function setT(key, field, value) { typed[key][field] = value; render(); }

$('chips').innerHTML = COMPANIES.map(c =>
  `<button class="chip${c === coFilter ? ' active' : ''}" data-co="${c}" onclick="setCo('${c}')">${c}</button>`).join('');
function setCo(c) { coFilter = c; document.querySelectorAll('.chip').forEach(b => b.classList.toggle('active', b.dataset.co === c)); render(); }

function useBoard(d) {
  records = d.records; transports = d.transports || [];
  applyPending();
  render();
}
// An LR saved here but not yet confirmed by the sheet: those bills leave the list straight away.
function applyOp(op) {
  if (op.params.action !== 'lr') return;
  const keys = op.params.keys.split(',');
  records = records.filter(r => !keys.includes(r.key));
}

// A consignment = the bill that was dispatched + the bills ticked as going together with it.
function consignments() {
  const mains = records.filter(r => !r.sentWith);
  const groups = mains.map(m => ({ main: m, bills: [m].concat(records.filter(r => r.sentWith === m.billNo && r.firm === m.firm)) }));
  records.filter(r => r.sentWith && !mains.some(m => m.billNo === r.sentWith && m.firm === r.firm))
    .forEach(r => groups.push({ main: r, bills: [r] }));
  return groups;
}

function render() {
  const q = $('searchInput').value.trim().toLowerCase();
  const groups = consignments()
    .filter(g => coFilter === 'All' || g.main.company === coFilter)
    .filter(g => !q || g.bills.some(b => [b.party, b.billNo, b.city, b.dispatchTransport].join(' ').toLowerCase().includes(q)))
    .sort((a, b) => a.main.dispatchedAt.localeCompare(b.main.dispatchedAt));
  if (!groups.length) {
    $('list').innerHTML = q
      ? `<div class="empty"><div class="empty-icon">🔍</div><div class="empty-title">No results</div><div class="empty-sub">Nothing matches "<b>${esc(q)}</b>"</div></div>`
      : `<div class="empty"><div class="empty-icon">✅</div><div class="empty-title">All clear!</div><div class="empty-sub">No LR pending</div></div>`;
    return;
  }
  $('list').innerHTML = `<div class="sec-label lred">LR PENDING &nbsp;${groups.length} &nbsp;· oldest first</div>` + groups.map(g => {
    const m = g.main, k = esc(m.key);
    const cases = g.bills.reduce((s, b) => s + (parseInt(b.dispatchCases || b.cases, 10) || 0), 0);
    const t = entry(m);
    const list = transports.slice();
    if (m.dispatchTransport && !list.includes(m.dispatchTransport)) list.unshift(m.dispatchTransport);
    const changed = m.dispatchTransport && t.transport !== m.dispatchTransport;
    return `
<div class="card" data-id="${k}">
  <div class="card-head" style="cursor:default">
    <div class="card-main">
      <div class="party-name">${esc(m.party)}</div>
      <div class="cases-row"><span class="cases-badge">📦 ${cases} cases</span></div>
      <div class="bill-info-row">
        <span class="co-badge ${coClass(m.company)}">${esc(m.company)}</span>
        ${g.bills.map(b => `<span class="bill-no-chip">#${esc(b.billNo)}</span>`).join('')}
        <span class="ic blue">🚛 ${esc(m.dispatchTransport || '—')}</span>
        ${m.city ? `<span class="ic">📍 ${esc(m.city)}</span>` : ''}
      </div>

      <div class="field-lbl" style="margin-top:14px">Transport that carried it</div>
      <select class="t-select" onchange="setT('${k}','transport',this.value)">
        ${list.map(x => `<option value="${esc(x)}"${x === t.transport ? ' selected' : ''}>${esc(x)}</option>`).join('')}
        <option value="__other"${t.transport === '__other' ? ' selected' : ''}>Other (type the name)…</option>
      </select>
      ${t.transport === '__other' ? `<input class="t-input" style="margin-top:8px" placeholder="Transport name" value="${esc(t.other)}" oninput="typed['${k}'].other=this.value">` : ''}
      <div class="t-warn${changed ? ' show' : ''}">⚠ Gate marked: <b>${esc(m.dispatchTransport || 'None')}</b></div>

      <div class="field-lbl" style="margin-top:14px">Dispatch date</div>
      <input class="t-input" type="date" id="dt-${k}" value="${esc(t.date)}" max="${new Date().toLocaleDateString('en-CA')}" onchange="typed['${k}'].date=this.value">

      <div class="field-lbl" style="margin-top:14px">LR number</div>
      <div class="lr-row" style="margin-top:0">
        <input class="t-input" id="lr-${k}" placeholder="LR number" value="${esc(t.lr)}" autocomplete="off" autocapitalize="characters"
          oninput="typed['${k}'].lr=this.value" onkeydown="if(event.key==='Enter')saveLr('${k}')">
        <button class="lr-save" id="ls-${k}" onclick="saveLr('${k}')">Save</button>
      </div>
    </div>
  </div>
</div>`;
  }).join('');
}

function saveLr(key) {
  const g = consignments().find(x => x.main.key === key);
  const t = entry(g.main);
  const input = document.getElementById('lr-' + key), lr = input.value.trim();
  const transport = t.transport === '__other' ? t.other.trim() : t.transport;
  if (!lr) { input.classList.add('required-err'); toast('Type the LR number', 'err'); return; }
  if (!transport) { toast('Choose the transport', 'err'); return; }
  if (!t.date) { document.getElementById('dt-' + key).classList.add('required-err'); toast('Choose the dispatch date', 'err'); return; }
  const bills = g.bills.map(b => '#' + b.billNo).join(', ');
  delete typed[key];
  enqueue({ action: 'lr', keys: g.bills.map(b => b.key).join(','), lr, transport, date: t.date, by: store.get('name') }, 'LR for ' + bills);
  render();
  toast('✓ LR saved for ' + bills, 'ok');
}

startApp('lr', useBoard);
</script>
</body>
</html>
