<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>Gate Dispatch · SNT</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#F2F4F7;--surface:#FFFFFF;--border:#DDE2EC;--border-strong:#B8C0CE;
  --text:#0B0F1A;--t2:#4A5568;--t3:#9AA3B2;
  --red:#D92B2B;--red-bg:#FFF1F1;--red-lt:#FECACA;
  --green:#15803D;--green-bg:#F0FDF6;--green-lt:#BBF7D0;
  --amber:#C47E00;--amber-bg:#FFFAEB;--amber-lt:#FDE68A;
  --blue:#1D4ED8;--blue-bg:#EFF6FF;
  --purple:#7C3AED;
  --s1:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
  --s2:0 4px 14px rgba(0,0,0,.10),0 2px 4px rgba(0,0,0,.06);
  --r:12px;--rs:8px
}
html{font-size:16px}
body{background:var(--bg);font-family:'DM Sans',system-ui,sans-serif;color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}

/* APP BAR */
.app-bar{background:var(--surface);border-bottom:1.5px solid var(--border);height:56px;padding:0 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100;box-shadow:var(--s1)}
.bar-logo{background:var(--amber);color:#fff;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:13px;letter-spacing:2px;padding:4px 10px;border-radius:6px;flex-shrink:0}
.bar-title{font-weight:700;font-size:16px;flex:1}
.bar-clock{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:19px;color:var(--t2);flex-shrink:0}
.refresh-btn{background:var(--bg);border:1.5px solid var(--border);color:var(--t2);width:40px;height:40px;border-radius:10px;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.refresh-btn:active{background:var(--border)}
.refresh-btn.spin{animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* BANNER */
.banner{padding:8px 14px;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:7px;min-height:36px;border-bottom:1px solid transparent}
.banner .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.b-ok{background:var(--green-bg);color:#166534;border-color:var(--green-lt)}
.b-ok .dot{background:var(--green)}
.b-err{background:var(--red-bg);color:#991B1B;border-color:var(--red-lt)}
.b-err .dot{background:var(--red)}
.b-load{background:var(--amber-bg);color:#854D0E;border-color:var(--amber-lt)}
.b-load .dot{background:var(--amber);animation:blink 1s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

/* STATS */
.stats-bar{background:var(--surface);border-bottom:1.5px solid var(--border);padding:8px 14px;display:flex;gap:14px;font-size:12.5px;font-weight:600;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.stats-bar::-webkit-scrollbar{display:none}
.si{display:flex;align-items:center;gap:5px;white-space:nowrap}
.si.red{color:var(--red)}.si.green{color:var(--green)}.si.gray{color:var(--t2)}

/* CHIPS */
.chips-row{background:var(--surface);border-bottom:1.5px solid var(--border);padding:10px 12px;display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips-row::-webkit-scrollbar{display:none}
.chip{border:1.5px solid var(--border);background:var(--surface);color:var(--t2);padding:7px 12px;border-radius:20px;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;white-space:nowrap;flex-shrink:0;display:flex;align-items:center;gap:5px;transition:all .15s}
.chip:active{transform:scale(.95)}
.chip.active{background:var(--text);color:#fff;border-color:var(--text)}
.cbadge{background:var(--red);color:#fff;font-size:10px;font-weight:800;min-width:18px;height:18px;padding:0 5px;border-radius:9px;display:flex;align-items:center;justify-content:center}
.chip.active .cbadge{background:rgba(255,255,255,.25)}
.cbadge.zero{background:var(--border-strong);color:var(--t3)}

/* SEARCH */
.search-row{background:var(--surface);border-bottom:1.5px solid var(--border);padding:10px 12px;position:relative}
.search-icon{position:absolute;left:25px;top:50%;transform:translateY(-50%);color:var(--t3);font-size:15px;pointer-events:none}
.search-input{width:100%;padding:11px 14px 11px 38px;font-size:15px;font-family:inherit;background:var(--bg);border:1.5px solid var(--border);border-radius:10px;outline:none;color:var(--text);transition:border-color .15s}
.search-input:focus{border-color:var(--blue);background:#fff}
.search-input::placeholder{color:var(--t3)}

/* LIST */
.list{padding:12px 11px 90px}
.sec-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--t3);padding:6px 3px 8px;display:flex;align-items:center;gap:8px}
.sec-label::after{content:'';flex:1;height:1px;background:var(--border)}
.sec-label.lred{color:var(--red)}
.sec-label.lgreen{color:var(--green)}

/* CARD */
.card{background:var(--surface);border-radius:var(--r);border:1.5px solid var(--border);margin-bottom:10px;overflow:hidden;box-shadow:var(--s1)}
.card.urgent{border-left:4px solid var(--red);background:var(--red-bg)}
.card.done{background:var(--green-bg);border-color:var(--green-lt)}
.card.saving{border-color:var(--purple);opacity:.8}

.card-head{padding:13px 13px 12px;cursor:pointer;user-select:none;display:flex;gap:10px;align-items:flex-start}
.card-main{flex:1;min-width:0}
.chevron{color:var(--t3);font-size:22px;flex-shrink:0;padding-top:1px;transition:transform .2s}
.card.open>.card-head .chevron{transform:rotate(180deg)}

.bill-row{display:flex;align-items:center;gap:7px;margin-bottom:7px;flex-wrap:wrap}
.bill-no{font-family:'Barlow Condensed',monospace;font-size:20px;font-weight:800;letter-spacing:.5px}
.done-tick{color:var(--green);font-size:18px;font-weight:700}
.co-badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;border:1.5px solid;white-space:nowrap}
.co-SNT{background:#FFFBEB;color:#92400E;border-color:#FCD34D}
.co-MaaRani{background:#FFF0F6;color:#9D174D;border-color:#F9A8D4}
.co-Lupin{background:var(--blue-bg);color:#1E40AF;border-color:#BFDBFE}
.co-Sun{background:#FFF7ED;color:#9A3412;border-color:#FDBA74}
.co-Torque{background:#F5F3FF;color:#5B21B6;border-color:#C4B5FD}
.utag{background:var(--red);color:#fff;font-size:10px;font-weight:800;padding:3px 8px;border-radius:6px;letter-spacing:.5px}
.sav-tag{background:var(--purple);color:#fff;font-size:10px;font-weight:700;padding:3px 8px;border-radius:6px}

.party-name{font-size:16px;font-weight:700;margin-bottom:9px;line-height:1.3}

.ichips{display:flex;flex-wrap:wrap;gap:5px}
.ic{background:var(--bg);border:1.5px solid var(--border);border-radius:16px;padding:5px 10px;font-size:12px;color:var(--t2);font-weight:500;display:inline-flex;align-items:center;gap:4px}
.ic.blue{background:var(--blue-bg);border-color:#BFDBFE;color:#1E40AF;font-weight:700}
.ic.amber{background:var(--amber-bg);border-color:var(--amber-lt);color:var(--amber);font-weight:700}
.ic.green{background:var(--green-bg);border-color:var(--green-lt);color:var(--green);font-weight:700}
.ic.time{font-family:'Barlow Condensed',monospace;font-size:13px;background:var(--green-bg);border-color:var(--green-lt);color:var(--green);font-weight:700}

/* CARD BODY */
.card-body{display:none;padding:14px 13px 15px;border-top:1.5px solid var(--border);margin:0 13px;padding-top:14px}
.card.open .card-body{display:block}
.field-lbl{font-size:11px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.6px;margin-bottom:7px}
.t-select{width:100%;padding:13px 14px;font-size:16px;font-family:inherit;font-weight:600;background:var(--surface);border:2px solid var(--border-strong);border-radius:var(--rs);color:var(--text);outline:none;cursor:pointer}
.t-select:focus{border-color:var(--blue)}
.t-warn{display:none;font-size:12px;font-weight:600;color:var(--amber);margin-top:6px;padding:6px 10px;background:var(--amber-bg);border-radius:6px;border-left:3px solid var(--amber)}
.t-warn.show{display:block}
.disp-btn{width:100%;padding:17px;background:var(--green);color:#fff;border:none;border-radius:var(--r);font-size:17px;font-weight:800;font-family:inherit;cursor:pointer;margin-top:13px;box-shadow:0 3px 12px rgba(21,128,61,.3);display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .1s,box-shadow .1s}
.disp-btn:active{transform:scale(.98);box-shadow:none}

/* UNDO */
.undo-btn{background:var(--amber-bg);border:2px solid var(--amber-lt);color:var(--amber);border-radius:var(--rs);padding:8px 11px;cursor:pointer;font-family:inherit;text-align:center;min-width:68px;flex-shrink:0;transition:background .15s}
.undo-btn:active{background:var(--amber-lt)}
.undo-btn.disabled{opacity:.45;pointer-events:none}
.ub-label{font-size:13px;font-weight:800;display:block}
.ub-time{font-size:11px;font-weight:500;display:block;margin-top:2px;color:#92400E}

/* EMPTY */
.empty{text-align:center;padding:60px 20px 40px}
.empty-icon{font-size:52px;margin-bottom:14px}
.empty-title{font-size:18px;font-weight:700;color:var(--t2);margin-bottom:6px}
.empty-sub{font-size:14px;color:var(--t3)}

/* TOAST */
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);padding:12px 22px;border-radius:24px;font-weight:700;font-size:13.5px;z-index:999;box-shadow:var(--s2);white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .2s;max-width:92vw}
.toast.show{opacity:1}
.toast.ok{background:#052E16;color:#D1FAE5}
.toast.err{background:#7F1D1D;color:#FEE2E2}
.toast.info{background:#1E1B4B;color:#EDE9FE}
</style>
</head>
<body>

<header class="app-bar">
  <span class="bar-logo">SNT</span>
  <span class="bar-title">Gate Dispatch</span>
  <span class="bar-clock" id="clock">--:--</span>
  <button class="refresh-btn" id="refreshBtn" onclick="loadData()" title="Refresh">↻</button>
</header>

<div class="banner b-load" id="banner">
  <span class="dot"></span>
  <span id="bannerTxt">Connecting…</span>
</div>

<div class="stats-bar" id="statsBar"><span class="si gray">Loading…</span></div>

<div class="chips-row">
  <button class="chip active" data-co="ALL"      onclick="setFilter('ALL')">All <span class="cbadge" id="cnt-ALL">–</span></button>
  <button class="chip"        data-co="SNT"      onclick="setFilter('SNT')">SNT <span class="cbadge zero" id="cnt-SNT">0</span></button>
  <button class="chip"        data-co="Maa Rani" onclick="setFilter('Maa Rani')">Maa Rani <span class="cbadge zero" id="cnt-MaaRani">0</span></button>
  <button class="chip"        data-co="Lupin"    onclick="setFilter('Lupin')">Lupin <span class="cbadge zero" id="cnt-Lupin">0</span></button>
  <button class="chip"        data-co="Sun"      onclick="setFilter('Sun')">Sun <span class="cbadge zero" id="cnt-Sun">0</span></button>
  <button class="chip"        data-co="Torque"   onclick="setFilter('Torque')">Torque <span class="cbadge zero" id="cnt-Torque">0</span></button>
</div>

<div class="search-row">
  <span class="search-icon">🔍</span>
  <input type="search" id="searchInput" class="search-input"
    placeholder="Search bill, party, transport…" oninput="onSearch()"/>
</div>

<main class="list" id="list">
  <div class="empty">
    <div class="empty-icon">🔌</div>
    <div class="empty-title">Connecting…</div>
    <div class="empty-sub">Please wait</div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════════════════════
//  CONFIG — URL hardcoded, no setup screen ever
// ═══════════════════════════════════════════════════
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbydYyG2SwhfYqNhCeq7U2jr6e2nxZ5sOYbwsFVmDtveg5IR76xV2offPqiAxiiDCr7l/exec';
const COMPANIES  = ['SNT','Maa Rani','Lupin','Sun','Torque'];
const ONE_HOUR   = 3600000;

// ═══════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════
let records    = [];
let transports = [];
let filter     = 'ALL';
let search     = '';
let openId     = null;
let saving     = {};   // id → true while a background op is in flight

// ═══════════════════════════════════════════════════
//  STARTUP
// ═══════════════════════════════════════════════════
window.onload = () => {
  startClock();
  loadData();
  setInterval(() => { if (!Object.keys(saving).length) loadData(); }, 60000);
  setInterval(tickCountdowns, 30000);
};

function startClock() {
  const el = document.getElementById('clock');
  const tick = () => {
    const n = new Date();
    el.textContent = pad(n.getHours()) + ':' + pad(n.getMinutes());
  };
  tick(); setInterval(tick, 10000);
}

// ═══════════════════════════════════════════════════
//  LOAD
// ═══════════════════════════════════════════════════
async function loadData() {
  setBanner('load','Refreshing…'); spin(true);
  try {
    const needTransports = transports.length === 0;
    const reqs = [apiFetch(SCRIPT_URL + '?action=load')];
    if (needTransports) reqs.push(apiFetch(SCRIPT_URL + '?action=getTransports'));

    const [main, tr] = await Promise.all(reqs);
    if (!main.ok) throw new Error(main.error || 'Load failed');

    // Preserve optimistic records — don't overwrite them with stale server data
    const inFlight = new Set(Object.keys(saving));
    const fresh = (main.records || []);

    if (inFlight.size === 0) {
      records = fresh;
    } else {
      // Merge: keep local optimistic version for any record currently saving
      const byId = {};
      records.forEach(r => byId[r.id] = r);
      records = fresh.map(r => inFlight.has(r.id) && byId[r.id] ? byId[r.id] : r);
    }

    if (tr && tr.ok) transports = tr.transports || [];
    setBanner('ok','Connected · just now');
    render();
  } catch(e) {
    setBanner('err','Cannot reach Sheet — tap ↻');
    if (!records.length) {
      document.getElementById('list').innerHTML = `
        <div class="empty">
          <div class="empty-icon">📵</div>
          <div class="empty-title">Connection error</div>
          <div class="empty-sub">Check internet and tap ↻</div>
        </div>`;
    }
  } finally { spin(false); }
}

// ═══════════════════════════════════════════════════
//  RENDER
// ═══════════════════════════════════════════════════
function render() {
  const now = Date.now();
  let vis = filter === 'ALL' ? records : records.filter(r => r.company === filter);

  if (search) {
    const q = search.toLowerCase();
    vis = vis.filter(r =>
      r.billNo.toLowerCase().includes(q)               ||
      r.party.toLowerCase().includes(q)                ||
      (r.suggestedTransport||'').toLowerCase().includes(q) ||
      (r.actualTransport||'').toLowerCase().includes(q)    ||
      (r.city||'').toLowerCase().includes(q)
    );
  }

  const urgP = vis.filter(r => r.status==='pending' && r.urgent).sort(byDate);
  const normP = vis.filter(r => r.status==='pending' && !r.urgent).sort(byDate);
  const done  = vis.filter(r => r.status==='dispatched' && (now-r.dispatchedAt) < ONE_HOUR)
                   .sort((a,b) => b.dispatchedAt - a.dispatchedAt);

  updateChips(); updateStats(now);

  let html = '';
  if (!urgP.length && !normP.length && !done.length) {
    html = search
      ? `<div class="empty"><div class="empty-icon">🔍</div><div class="empty-title">No results</div><div class="empty-sub">Nothing matches "<b>${esc(search)}</b>"</div></div>`
      : `<div class="empty"><div class="empty-icon">✅</div><div class="empty-title">All clear!</div><div class="empty-sub">No pending dispatches</div></div>`;
  } else {
    if (urgP.length) { html += `<div class="sec-label lred">🔴 URGENT &nbsp;${urgP.length}</div>`; urgP.forEach(r => html += pendingCard(r)); }
    if (normP.length) { html += `<div class="sec-label">PENDING &nbsp;${normP.length}</div>`; normP.forEach(r => html += pendingCard(r)); }
    if (done.length) { html += `<div class="sec-label lgreen">✓ DISPATCHED &nbsp;${done.length}</div>`; done.forEach(r => html += doneCard(r, now)); }
  }

  document.getElementById('list').innerHTML = html;
  if (openId) {
    const el = document.querySelector(`[data-id="${CSS.escape(openId)}"]`);
    if (el) el.classList.add('open');
  }
}

// ═══════════════════════════════════════════════════
//  CARDS
// ═══════════════════════════════════════════════════
function pendingCard(r) {
  const co   = r.company.replace(/\s+/g,'');
  const isSv = !!saving[r.id];
  const opts = buildOpts(r.suggestedTransport);
  return `
<div class="card ${r.urgent?'urgent':''} ${isSv?'saving':''}" data-id="${esc(r.id)}">
  <div class="card-head" onclick="toggleCard('${esc(r.id)}')">
    <div class="card-main">
      <div class="bill-row">
        <span class="bill-no">${esc(r.billNo)}</span>
        <span class="co-badge co-${co}">${esc(r.company)}</span>
        ${r.urgent?'<span class="utag">⚡ URGENT</span>':''}
        ${isSv?'<span class="sav-tag">Saving…</span>':''}
      </div>
      <div class="party-name">${esc(r.party)}</div>
      <div class="ichips">
        <span class="ic">📦 ${r.cases||'—'} cases</span>
        <span class="ic blue">🚛 ${esc(r.suggestedTransport||'—')}</span>
        ${r.city?`<span class="ic">📍 ${esc(r.city)}</span>`:''}
        ${r.billDate?`<span class="ic">📅 ${esc(r.billDate)}</span>`:''}
      </div>
    </div>
    <div class="chevron">⌄</div>
  </div>
  <div class="card-body">
    <div class="field-lbl">Select Transport</div>
    <select class="t-select" id="ts-${esc(r.id)}"
      onchange="onTrChange('${esc(r.id)}','${esc(r.suggestedTransport||'')}')">
      ${opts}
    </select>
    <div class="t-warn" id="tw-${esc(r.id)}">⚠ Original suggestion: <b>${esc(r.suggestedTransport||'None')}</b></div>
    <button class="disp-btn" onclick="doDispatch(event,'${esc(r.id)}','${esc(r.company)}','${esc(r.billNo)}')">✓ &nbsp;Dispatch Now</button>
  </div>
</div>`;
}

function doneCard(r, now) {
  const co      = r.company.replace(/\s+/g,'');
  const minsLeft = Math.max(0, Math.floor((r.dispatchedAt + ONE_HOUR - now) / 60000));
  const changed  = r.actualTransport && r.actualTransport !== r.suggestedTransport;
  const isSv     = !!saving[r.id];
  return `
<div class="card done ${isSv?'saving':''}" data-id="${esc(r.id)}">
  <div class="card-head" style="cursor:default">
    <div class="card-main">
      <div class="bill-row">
        <span class="done-tick">✓</span>
        <span class="bill-no">${esc(r.billNo)}</span>
        <span class="co-badge co-${co}">${esc(r.company)}</span>
        ${isSv?'<span class="sav-tag">Saving…</span>':''}
      </div>
      <div class="party-name" style="color:var(--green)">${esc(r.party)}</div>
      <div class="ichips">
        <span class="ic green">🚛 ${esc(r.actualTransport||'—')}</span>
        <span class="ic time">⏱ ${esc(r.dispatchTime||'')}</span>
        <span class="ic">📦 ${r.cases||'—'} cases</span>
        ${changed?`<span class="ic amber" style="font-size:11px">was: ${esc(r.suggestedTransport)}</span>`:''}
      </div>
    </div>
    <button class="undo-btn ${isSv?'disabled':''}"
      onclick="doUndo(event,'${esc(r.id)}','${esc(r.company)}','${esc(r.billNo)}')">
      <span class="ub-label">↩ Undo</span>
      <span class="ub-time" id="uc-${esc(r.id)}">${minsLeft}m left</span>
    </button>
  </div>
</div>`;
}

// ═══════════════════════════════════════════════════
//  DISPATCH — optimistic: update UI first, save in background
// ═══════════════════════════════════════════════════
function doDispatch(e, id, company, billNo) {
  e.stopPropagation();
  if (saving[id]) return;

  const sel = document.getElementById('ts-' + id);
  const transport = sel ? sel.value : '';
  if (!transport) { toast('Select a transport first','err'); return; }

  const rec = records.find(r => r.id === id);
  if (!rec) return;

  // Snapshot for rollback
  const snap = { ...rec };

  // ── Instant UI update ──
  const now = new Date();
  rec.status          = 'dispatched';
  rec.actualTransport = transport;
  rec.dispatchTime    = pad(now.getHours()) + ':' + pad(now.getMinutes());
  rec.dispatchedAt    = now.getTime();
  openId = null;
  saving[id] = true;
  render();

  // ── Background save ──
  const url = `${SCRIPT_URL}?action=dispatch&company=${encodeURIComponent(company)}&billNo=${encodeURIComponent(billNo)}&transport=${encodeURIComponent(transport)}`;

  apiFetch(url).then(data => {
    delete saving[id];
    if (!data.ok) {
      Object.assign(rec, snap); // rollback
      render();
      toast('Save failed: ' + (data.error||'error'), 'err');
      return;
    }
    // Patch with authoritative server time
    if (data.dispatchTime) rec.dispatchTime = data.dispatchTime;
    if (data.dispatchedAt) rec.dispatchedAt = data.dispatchedAt;
    render();
    toast('✓ ' + billNo + ' dispatched · ' + rec.dispatchTime, 'ok');
  }).catch(() => {
    delete saving[id];
    Object.assign(rec, snap);
    render();
    toast('Network error — tap ↻ to retry', 'err');
  });
}

// ═══════════════════════════════════════════════════
//  UNDO — optimistic, resets the 1-hour window fully each time
// ═══════════════════════════════════════════════════
function doUndo(e, id, company, billNo) {
  e.stopPropagation();
  if (saving[id]) return;

  const rec = records.find(r => r.id === id);
  if (!rec) return;

  const snap = { ...rec };

  // ── Instant UI update — card moves back to pending ──
  rec.status          = 'pending';
  rec.actualTransport = null;
  rec.dispatchTime    = null;
  rec.dispatchedAt    = null;
  saving[id] = true;
  // Do NOT restore openId — gatekeeper should explicitly re-tap to re-dispatch
  render();

  const url = `${SCRIPT_URL}?action=undo&company=${encodeURIComponent(company)}&billNo=${encodeURIComponent(billNo)}`;

  apiFetch(url).then(data => {
    delete saving[id];
    if (!data.ok) {
      Object.assign(rec, snap);
      render();
      toast('Undo failed: ' + (data.error||'error'), 'err');
      return;
    }
    render();
    toast('↩ ' + billNo + ' back to pending', 'ok');
  }).catch(() => {
    delete saving[id];
    Object.assign(rec, snap);
    render();
    toast('Network error — try again', 'err');
  });
}

// ═══════════════════════════════════════════════════
//  CARD INTERACTION
// ═══════════════════════════════════════════════════
function toggleCard(id) {
  if (openId === id) {
    openId = null;
    document.querySelector(`[data-id="${CSS.escape(id)}"]`)?.classList.remove('open');
  } else {
    if (openId) document.querySelector(`[data-id="${CSS.escape(openId)}"]`)?.classList.remove('open');
    openId = id;
    const el = document.querySelector(`[data-id="${CSS.escape(id)}"]`);
    el?.classList.add('open');
    setTimeout(() => el?.scrollIntoView({behavior:'smooth',block:'nearest'}), 60);
  }
}

function onTrChange(id, suggested) {
  const sel  = document.getElementById('ts-' + id);
  const warn = document.getElementById('tw-' + id);
  if (sel && warn) warn.classList.toggle('show', !!suggested && sel.value !== suggested);
}

// ═══════════════════════════════════════════════════
//  FILTER & SEARCH
// ═══════════════════════════════════════════════════
function setFilter(co) {
  filter = co;
  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c.dataset.co === co));
  render();
}
function onSearch() {
  search = document.getElementById('searchInput').value.trim();
  render();
}

// ═══════════════════════════════════════════════════
//  COUNTDOWNS
// ═══════════════════════════════════════════════════
function tickCountdowns() {
  const now = Date.now();
  const before = records.filter(r => r.status==='dispatched').length;
  records = records.filter(r => r.status!=='dispatched' || (now-r.dispatchedAt) < ONE_HOUR);
  const after = records.filter(r => r.status==='dispatched').length;
  records.filter(r => r.status==='dispatched').forEach(r => {
    const el = document.getElementById('uc-' + r.id);
    if (el) el.textContent = Math.max(0, Math.floor((r.dispatchedAt + ONE_HOUR - now) / 60000)) + 'm left';
  });
  if (before !== after) render();
}

// ═══════════════════════════════════════════════════
//  CHIPS & STATS
// ═══════════════════════════════════════════════════
function updateChips() {
  const allP = records.filter(r => r.status==='pending').length;
  setCount('ALL', allP);
  COMPANIES.forEach(co => setCount(co, records.filter(r => r.company===co && r.status==='pending').length));
}
function setCount(co, n) {
  const el = document.getElementById('cnt-' + co.replace(/\s+/g,''));
  if (!el) return;
  el.textContent = n || '';
  el.classList.toggle('zero', n === 0);
}
function updateStats(now) {
  const urg  = records.filter(r => r.status==='pending' && r.urgent).length;
  const pend = records.filter(r => r.status==='pending').length;
  const done = records.filter(r => r.status==='dispatched' && (now-r.dispatchedAt)<ONE_HOUR).length;
  document.getElementById('statsBar').innerHTML = `
    ${urg?`<span class="si red">🔴 ${urg} urgent</span>`:''}
    <span class="si gray">⏳ ${pend} pending</span>
    <span class="si green">✓ ${done} dispatched</span>`;
}

// ═══════════════════════════════════════════════════
//  HELPERS
// ═══════════════════════════════════════════════════
function buildOpts(suggested) {
  const list = [...transports];
  if (suggested && !list.includes(suggested)) list.unshift(suggested);
  if (!list.length) return `<option value="${esc(suggested||'')}">${esc(suggested||'(No transports)')}</option>`;
  return list.map(t => `<option value="${esc(t)}"${t===suggested?' selected':''}>${esc(t)}</option>`).join('');
}

async function apiFetch(url) {
  const r = await fetch(url, {redirect:'follow'});
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

function byDate(a,b) { return parseDMY(a.billDate) - parseDMY(b.billDate); }
function parseDMY(s) {
  if (!s) return 0;
  const [d,m,y] = s.split('/');
  return new Date(+y,+m-1,+d).getTime() || 0;
}
function pad(n) { return String(n).padStart(2,'0'); }
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}

function setBanner(state, msg) {
  document.getElementById('banner').className = 'banner b-' + state;
  document.getElementById('bannerTxt').textContent = msg;
}
function spin(v) { document.getElementById('refreshBtn').classList.toggle('spin', v); }

let toastTimer;
function toast(msg, type) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.className = 'toast ' + type + ' show';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3000);
}
</script>
