<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dispatch Board</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="bar">
  <span class="logo">SNT</span>
  <h1>Dispatch Board</h1>
  <a class="nav" href="lr.html">LR entry</a>
  <button class="who" id="who" onclick="showGate('')"></button>
  <button class="icon-btn" id="refresh" onclick="load()" aria-label="Refresh">&#8635;</button>
</div>
<div class="wrap">
  <div class="status" id="status">Loading…</div>
  <input class="search" id="search" placeholder="Search party, city or bill no" oninput="render()">
  <div class="chips" id="chips"></div>
  <div class="tabs">
    <button class="tab" data-tab="pack" onclick="setTab('pack')"><small id="nPack">0</small>To pack</button>
    <button class="tab active" data-tab="ready" onclick="setTab('ready')"><small id="nReady">0</small>Ready</button>
    <button class="tab" data-tab="sent" onclick="setTab('sent')"><small id="nSent">0</small>Dispatched</button>
  </div>
  <div id="list"></div>
</div>
<div class="gate" id="gate" style="display:none">
  <form onsubmit="gateSubmit(event)">
    <h2>Sign in</h2><p>Asked once on this device.</p>
    <input class="txt" id="gateName" placeholder="Your name" autocomplete="name">
    <input class="txt" id="gatePin" placeholder="Team PIN" inputmode="numeric" autocomplete="off">
    <div class="err" id="gateErr"></div>
    <button class="btn" type="submit">Continue</button>
  </form>
</div>
<div class="toast" id="toast"></div>
<script src="app.js"></script>
<script>
const S_PACK = 'To pack', S_READY = 'Ready to dispatch', S_SENT = 'Dispatched - LR pending', S_DONE = 'Complete';
const FIRMS = ['All', 'SNT', 'SNT Cash', 'MRS'];
const firmOf = (r) => r.company || r.firm;
const AREAS = ['Sarkhej', 'Aslali'];
const VEHICLES = [['big', 'Big'], ['small', 'Small'], ['self', 'Self']];
let records = [], transports = [], tab = 'ready', firm = 'All', openKey = '', busy = false;
const draft = {};   // key -> {vehicle, area, transport, other, with:{}}

$('chips').innerHTML = FIRMS.map(f => `<button class="chip${f === firm ? ' active' : ''}" onclick="setFirm('${f}')">${f}</button>`).join('');

function setFirm(f) { firm = f; document.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c.textContent === f)); render(); }
function setTab(t) { tab = t; document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === t)); render(); }

async function load() {
  $('refresh').classList.add('spin');
  try {
    const d = await api({ action: 'board' });
    if (!d.ok) throw new Error(d.error || 'Load failed');
    records = d.records || []; transports = d.transports || [];
    $('status').className = 'status'; $('status').textContent = 'Updated ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    render();
  } catch (e) {
    $('status').className = 'status err'; $('status').textContent = e.message;
  } finally { $('refresh').classList.remove('spin'); }
}

function visible() {
  const q = $('search').value.trim().toLowerCase();
  return records.filter(r => (firm === 'All' || firmOf(r) === firm) &&
    (!q || (r.party + ' ' + r.billNo + ' ' + r.city).toLowerCase().includes(q)));
}

function render() {
  const v = visible();
  const pack = v.filter(r => r.status === S_PACK), ready = v.filter(r => r.status === S_READY);
  const sent = v.filter(r => r.status === S_SENT || r.status === S_DONE);
  $('nPack').textContent = pack.length; $('nReady').textContent = ready.length; $('nSent').textContent = sent.length;
  const byParty = (a, b) => a.party.localeCompare(b.party);
  let html = '';
  if (tab === 'pack') html = pack.sort((a, b) => a.firstPrinted.localeCompare(b.firstPrinted)).map(packCard).join('');
  if (tab === 'ready') html = ready.sort(byParty).map(readyCard).join('');
  if (tab === 'sent') html = sent.sort((a, b) => b.dispatchedAt.localeCompare(a.dispatchedAt)).map(sentCard).join('');
  $('list').innerHTML = html || '<div class="empty">Nothing here.</div>';
}

function head(r, extra) {
  const cases = parseInt(r.cases, 10) > 0 ? `<span class="tag cases">${esc(r.cases)} cases</span>` : '<span class="tag nocases">No cases yet</span>';
  return `<div class="party">${esc(r.party || '(party not read)')}</div>
    <div class="meta"><span class="tag firm">${esc(firmOf(r))}</span><span class="tag">#${esc(r.billNo)}</span>${cases}
    ${r.city ? `<span class="tag">${esc(r.city)}</span>` : ''}${r.suggested ? `<span class="tag blue">${esc(r.suggested)}</span>` : ''}<span class="tag">${esc(r.billDate)}</span>${extra || ''}</div>`;
}

function packCard(r) {
  const old = daysSince(r.firstPrinted) > 2;
  return `<div class="card${old ? ' old' : ''}"><div class="card-head">${head(r, old ? '<span class="tag warn">Waiting over 2 days</span>' : '')}</div></div>`;
}

function readyCard(r) {
  const d = draft[r.key] || (draft[r.key] = { vehicle: '', area: '', transport: r.suggested || '', other: '', cases: r.cases || '', remark: '', with: {} });
  const others = records.filter(o => o.key !== r.key && o.party === r.party && o.firm === r.firm &&
    (o.status === S_PACK || o.status === S_READY) && daysSince(o.firstPrinted) <= 7);
  const list = transports.slice(); if (r.suggested && !list.includes(r.suggested)) list.unshift(r.suggested);
  const k = esc(r.key);
  return `<div class="card${openKey === r.key ? ' open' : ''}" data-key="${k}">
  <div class="card-head" onclick="toggle('${k}')">${head(r)}</div>
  <div class="card-body">
    <div class="lbl">Transport</div>
    <select onchange="setD('${k}','transport',this.value)">
      ${d.transport ? '' : '<option value="" selected>Choose transport…</option>'}
      ${list.map(t => `<option${t === d.transport ? ' selected' : ''}>${esc(t)}</option>`).join('')}
      <option value="__other"${d.transport === '__other' ? ' selected' : ''}>Other…</option>
    </select>
    ${d.transport === '__other' ? `<input class="txt" style="margin-top:8px" placeholder="Type transport name" value="${esc(d.other)}" oninput="draft['${k}'].other=this.value">` : ''}
    <div class="lbl">Cases being sent</div>
    <input class="txt" inputmode="numeric" value="${esc(d.cases)}" oninput="draft['${k}'].cases=this.value">
    <div class="lbl">Vehicle</div>
    <div class="pick" id="veh-${k}">${VEHICLES.map(([v, n]) => `<button class="${d.vehicle === v ? 'on' : ''}" onclick="setD('${k}','vehicle','${v}')">${n}</button>`).join('')}</div>
    <div class="lbl">Area</div>
    <div class="pick" id="area-${k}">${AREAS.map(a => `<button class="${d.area === a ? 'on' : ''}" onclick="setD('${k}','area','${a}')">${a}</button>`).join('')}</div>
    ${others.length ? `<div class="lbl">Other bills of this party sent together</div><div class="with">${others.map(o =>
      `<label><input type="checkbox"${d.with[o.key] ? ' checked' : ''} onchange="draft['${k}'].with['${esc(o.key)}']=this.checked">
       #${esc(o.billNo)} · ${esc(o.billDate)} · ${parseInt(o.cases, 10) > 0 ? esc(o.cases) + ' cases' : 'no cases'}</label>`).join('')}</div>` : ''}
    <div class="lbl">Remark (optional)</div>
    <input class="txt" placeholder="Anything dispatch should note" value="${esc(d.remark)}" oninput="draft['${k}'].remark=this.value">
    <button class="btn" onclick="dispatch('${k}')">Mark dispatched</button>
  </div></div>`;
}

function sentCard(r) {
  const k = esc(r.key);
  const extra = `<span class="tag blue">${esc(r.dispatchTransport)}</span>${r.vehicle ? `<span class="tag">${esc(r.vehicle)}</span>` : ''}${r.area ? `<span class="tag">${esc(r.area)}</span>` : ''}
    ${r.dispatchCases && r.dispatchCases !== r.cases ? `<span class="tag warn">sent ${esc(r.dispatchCases)} cases</span>` : ''}
    ${r.sentWith ? `<span class="tag warn">with #${esc(r.sentWith)}</span>` : ''}
    ${r.lrNo ? `<span class="tag cases">LR ${esc(r.lrNo)}</span>` : '<span class="tag nocases">LR pending</span>'}`;
  return `<div class="card${openKey === r.key ? ' open' : ''}" data-key="${k}">
  <div class="card-head" onclick="toggle('${k}')">${head(r, extra)}</div>
  <div class="card-body"><div style="font-size:13px;color:var(--t2)">Dispatched ${esc(r.dispatchedAt)}${r.dispatchedBy ? ' by ' + esc(r.dispatchedBy) : ''}${r.remark ? '<br>Remark: ' + esc(r.remark) : ''}</div>
    ${r.lrNo || r.sentWith ? '' : `<button class="btn ghost" onclick="undo('${k}')">Undo dispatch</button>`}</div></div>`;
}

function toggle(key) { openKey = openKey === key ? '' : key; render(); }
function setD(key, field, value) { draft[key][field] = value; render(); }

async function dispatch(key) {
  if (busy) return;
  const d = draft[key], r = records.find(x => x.key === key);
  const transport = d.transport === '__other' ? d.other.trim() : d.transport;
  let bad = false;
  if (!d.vehicle) { document.getElementById('veh-' + key).classList.add('need'); bad = true; }
  if (!d.area) { document.getElementById('area-' + key).classList.add('need'); bad = true; }
  if (!transport) bad = true;
  if (!(parseInt(d.cases, 10) > 0)) bad = true;
  if (bad) { toast('Fill transport, cases, vehicle and area', true); return; }
  busy = true;
  try {
    const d2 = await api({ action: 'dispatch', key, transport, vehicle: d.vehicle, area: d.area, by: store.get('name'),
      cases: String(parseInt(d.cases, 10)), remark: d.remark.trim(),
      with: Object.keys(d.with).filter(x => d.with[x]).join(',') });
    if (!d2.ok) throw new Error(d2.error || 'Not saved');
    toast('Dispatched #' + r.billNo); openKey = ''; delete draft[key];
    await load();
  } catch (e) { toast(e.message, true); } finally { busy = false; }
}

async function undo(key) {
  if (busy) return; busy = true;
  try {
    const d = await api({ action: 'undo', key });
    if (!d.ok) throw new Error(d.error || 'Not saved');
    toast('Dispatch undone'); openKey = ''; await load();
  } catch (e) { toast(e.message, true); } finally { busy = false; }
}

startApp();
setInterval(() => { if (!busy && !openKey && store.get('pin')) load(); }, 60000);
</script>
</body>
</html>
